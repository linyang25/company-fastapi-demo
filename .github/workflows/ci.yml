name: CD - Deploy to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          cd $GITHUB_WORKSPACE
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Restart service
        run: |
          sudo systemctl restart fastapi-demo
          sudo systemctl status fastapi-demo --no-pager